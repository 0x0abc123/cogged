name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests (offline, no database)
        run: go test -race ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean. Run 'gofmt -w .' and commit:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files are gofmt-clean."

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # golangci-lint v2 (via action v8): v1 binaries are built with Go < 1.25 and
      # refuse to analyze this module (go.mod targets 1.25). The pinned version keeps
      # results reproducible; bump deliberately.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  integration:
    name: integration tests (testcontainers Dgraph)
    runs-on: ubuntu-latest
    # Boots dgraph/standalone via testcontainers. Docker is preinstalled on ubuntu-latest.
    # Non-blocking initially in case the image pull is slow/flaky; tighten once stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        run: go test -tags=integration -timeout 15m ./...
